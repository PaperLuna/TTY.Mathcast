[package]
name = "mathcast"
version = "1.0.0"
description = "数学题讲解视频生成器"
authors = ["hmrBH"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mathcast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
parking_lot = "0.12"

[features]
# This feature is used for production builds or when `devUrl` points to the
# filesystem. Do not remove.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
